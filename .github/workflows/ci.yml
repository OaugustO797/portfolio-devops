name: CI do portfólio

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Linter (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar entrada, tamanho e conteúdo
        run: bash scripts/prepare-site.sh
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Executar HTMLHint
        run: npm run lint
      - name: Verificar links e imagens
        run: npm run check:links
